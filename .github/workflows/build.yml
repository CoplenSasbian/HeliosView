name: build

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # The top-level CMakeLists requires CMake >= 4.3; pin a recent one so the
      # runner's bundled version cannot be too old.
      - uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '4.3.0'

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build (Release)
        run: cmake --build build --config Release

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: heliosview-win64
          path: |
            build/bin/HeliosView.dll
            build/bin/WebView2Loader.dll
            build/bin/*.exe

      # On version tags, attach the binaries to the GitHub release (if it has
      # been created). Otherwise they stay on the build artifacts.
      - name: Attach to release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" build/bin/HeliosView.dll build/bin/WebView2Loader.dll build/bin/*.exe --clobber
            echo "attached binaries to $tag"
          else
            echo "release $tag does not exist yet - binaries are on the build artifacts"
          fi
