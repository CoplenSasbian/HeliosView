name: build

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    # The tag step creates the release and uploads the SDK zip.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # third_party/stdexec and third_party/json are git submodules
          # (vendored header-only deps); checkout must fetch them.
          submodules: recursive

      # windows-latest ships Visual Studio 2026, not 2022 - and std::flat_map
      # needs a recent MSVC. msvc-dev-cmd finds the latest installed VS toolset
      # (vcvars); Ninja matches the local build setup. The top-level CMakeLists
      # requires CMake >= 4.3, so install a recent one rather than trusting the
      # runner's bundled version.
      - uses: ilammy/msvc-dev-cmd@v1

      - uses: jwlawson/actions-setup-cmake@v2

      - name: Show cmake version
        shell: pwsh
        run: |
          $v = cmake --version 2>&1 | Select-Object -First 1
          "::notice::cmake: $v"

      - name: Configure
        shell: pwsh
        run: |
          $log = cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release 2>&1
          if ($LASTEXITCODE -ne 0) {
            $log | Select-Object -Last 30 | ForEach-Object { "::error::$_" }
            exit 1
          }
          $log

      - name: Build (Release)
        run: cmake --build build

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: heliosview-win64
          path: |
            build/bin/HeliosView.dll
            build/bin/WebView2Loader.dll
            build/bin/*.exe

      # ---- SDK package (bin/ + lib/ + include/ + examples/) ----
      # `cmake --install` produces the bin/lib/include layout (import library,
      # CMake package config under lib/cmake/HeliosView, C + C++ headers, and the
      # vendored stdexec/nlohmann headers). The example *sources* are copied in
      # separately, so the SDK is self-contained: extract the zip and build an
      # app against it with find_package(HeliosView), or build examples/ as its
      # own CMake project. packaging/README.md becomes the zip's README.md.
      - name: Stage SDK package
        shell: pwsh
        run: |
          $m = Select-String -Path CMakeLists.txt -Pattern 'project\(HeliosView\s+VERSION\s+([0-9.]+)'
          $ver = if ($m) { $m.Matches[0].Groups[1].Value } else { '' }
          if (-not $ver) { throw "could not read PROJECT_VERSION from CMakeLists.txt" }
          "::notice::packaging HeliosView $ver (win64)"
          $sdk = Join-Path $PWD "build/sdk"
          if (Test-Path $sdk) { Remove-Item -Recurse -Force $sdk }
          $root = Join-Path $sdk "HeliosView-$ver-win64"
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          cmake --install build --prefix $root
          New-Item -ItemType Directory -Force -Path (Join-Path $root "examples") | Out-Null
          Copy-Item examples\CMakeLists.txt, examples\*.cpp, examples\*.c -Destination (Join-Path $root "examples")
          # Prebuilt demos go into bin/ alongside the DLLs, so the package is
          # runnable as-is (extract and double-click a demo).
          Copy-Item build\bin\*.exe -Destination (Join-Path $root "bin")
          Copy-Item packaging\README.md -Destination (Join-Path $root "README.md")
          $zip = Join-Path $sdk "HeliosView-$ver-win64-SDK.zip"
          Compress-Archive -Path $root -DestinationPath $zip -CompressionLevel Optimal
          Get-ChildItem $sdk | Select-Object Name, Length

      - name: Upload SDK package
        uses: actions/upload-artifact@v4
        with:
          name: heliosview-sdk-win64
          path: build/sdk/HeliosView-*-win64-SDK.zip

      # On version tags, publish the SDK zip: attach it to the release if one
      # exists, otherwise create the release (title + bilingual notes from
      # packaging/release-notes.md). Otherwise everything stays on the build
      # artifacts.
      - name: Publish SDK zip to release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          zip="$(ls build/sdk/HeliosView-*-win64-SDK.zip | head -n1)"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$zip" --clobber
            echo "attached $zip to $tag"
          else
            if [ -f packaging/release-notes.md ]; then
              gh release create "$tag" "$zip" --title "HeliosView $tag" --notes-file packaging/release-notes.md
            else
              gh release create "$tag" "$zip" --title "HeliosView $tag"
            fi
            echo "created release $tag with $zip"
          fi
