name: build

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # windows-latest ships Visual Studio 2026, not 2022 - and std::flat_map
      # needs a recent MSVC. msvc-dev-cmd finds the latest installed VS toolset
      # (vcvars); Ninja matches the local build setup. The top-level CMakeLists
      # requires CMake >= 4.3, so install a recent one rather than trusting the
      # runner's bundled version.
      - uses: ilammy/msvc-dev-cmd@v1

      - uses: jwlawson/actions-setup-cmake@v2

      - name: Show cmake version
        shell: pwsh
        run: |
          $v = cmake --version 2>&1 | Select-Object -First 1
          "::notice::cmake: $v"

      - name: Configure
        shell: pwsh
        run: |
          $log = cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release 2>&1
          if ($LASTEXITCODE -ne 0) {
            $log | Select-Object -Last 30 | ForEach-Object { "::error::$_" }
            exit 1
          }
          $log

      - name: Build (Release)
        run: cmake --build build

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: heliosview-win64
          path: |
            build/bin/HeliosView.dll
            build/bin/WebView2Loader.dll
            build/bin/*.exe

      # On version tags, attach the binaries to the GitHub release (if it has
      # been created). Otherwise they stay on the build artifacts.
      - name: Attach to release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" build/bin/HeliosView.dll build/bin/WebView2Loader.dll build/bin/*.exe --clobber
            echo "attached binaries to $tag"
          else
            echo "release $tag does not exist yet - binaries are on the build artifacts"
          fi
